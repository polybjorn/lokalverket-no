# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when the PR actually merged.
# A closed-unmerged PR, anyone else's branch and main are all left alone.
#
# Two things here look redundant and are not. Both come from #16, and the
# reasoning is the rovar-no session's (its #16 / PR #17); this is that shape
# adapted rather than a second solution to the same problem.
#
# 1. The guard is in the script, not in the job `if:`. This forge's
#    actions/tasks response has a `status` field and no `conclusion` field at
#    all, so from that listing a job skipped by its `if:` and a job that ran and
#    deleted something read as the same word. A guard that quietly stops
#    matching then produces a green tick over nothing.
#
#    Job logs ARE readable here, unlike on rovar-no where the same check was
#    written: GET /actions/jobs/{job_id}/logs returns 200 for the agent token,
#    with the job id from /actions/runs/{run_id}/jobs rather than from the tasks
#    listing. So a green tick on this repo can still be interrogated. It takes a
#    second call and someone deciding to make it, which is why the guard moves
#    anyway.
#
# 2. The job asks what is true at the end instead of trusting the status it got
#    back, so success here means the branch is gone rather than the API having
#    answered something recognisable.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    runs-on: docker
    timeout-minutes: 5
    steps:
      # No checkout: the script is here and node's global fetch is in the image.
      # media-tools runs the same job on the `python` label with urllib because
      # that image guarantees the standard library; `docker` here is
      # node:22-bookworm, so fetch is the equivalent that cannot be missing.
      #
      # A heredoc rather than `node -e`, so the script may contain apostrophes.
      # Under `node -e '...'` a single quote ends the shell string, which has
      # already cost one reworded comment in this file.
      - name: Delete the head branch
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          node - <<'JS'
          const branch = process.env.BRANCH;
          // Each segment is escaped but the slashes are left alone: the API
          // matches a branch name as a path, so herd%2Ffoo does not resolve.
          const path = branch.split("/").map(encodeURIComponent).join("/");
          const url = `${process.env.API}/branches/${path}`;
          const auth = { Authorization: `token ${process.env.TOKEN}` };

          const done = (msg) => { console.log(msg); process.exit(0); };
          const fail = (msg) => { console.log(msg); process.exit(1); };

          (async () => {
            // These two were the job's `if:` until #16. Here they say so out
            // loud, so the log distinguishes "not mine to touch" from "did it".
            if (process.env.MERGED !== "true") done(`PR closed without merging, leaving ${branch}`);
            if (!branch.startsWith("herd/")) done(`${branch} is not ours, leaving it`);

            const del = await fetch(url, { method: "DELETE", headers: auth });

            // Deliberately not branching on del.status. Forgejo 16.0.4 answers
            // 500 with an empty message when the branch is already gone, not the
            // documented 404 - measured against this repo on 2026-09-14 - so the
            // first version's "404 means someone got there first" arm was dead
            // code and the already-gone case fell into the failure arm. Asking
            // what is true now is both simpler and correct whatever it answers.
            const check = await fetch(url, { headers: auth });

            if (check.status === 404) {
              done(del.ok ? `deleted ${branch}` : `${branch} is gone (delete said ${del.status})`);
            }
            if (check.status === 200) {
              // Reported success and the branch survived. rovar-no saw exactly
              // this on its PR #15 and could not establish why. Whatever the
              // cause, it has to be red rather than a green tick over nothing.
              fail(`${branch} is still on the remote after DELETE answered ${del.status}\n${await del.text()}`);
            }
            fail(`cannot tell whether ${branch} is gone: DELETE ${del.status}, GET ${check.status}`);
          })().catch((err) => fail(`could not delete ${branch}: ${err.message}`));
          JS

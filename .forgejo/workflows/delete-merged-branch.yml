# Deletes herd/ branches that are already merged into main. The forge-native way
# to do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo, where
# it can be read and changed without admin rights.
#
# One job, three triggers. There used to be a second job that ran only on a merge
# and did the deleting through the forge API, with the sweep behind it as a
# backstop. That job is removed, and the reason is not tidiness.
#
# IT USED THE API AS BOTH EXECUTOR AND JUDGE. It sent DELETE /branches/{name} and
# then asked GET /branches/{name} whether that had worked, treating 404 as gone.
# On rovar-no PR #23 the DELETE returned 2xx and the verification GET returned
# 404 - both saying the branch was gone - while the ref was still on the remote.
# Checking the end state through the API is not a check when the API is the thing
# that is wrong. The two specimens nixfleet #172 was measured on were this repo's
# own branches, herd/check-tests and herd/deps-credential-precheck: both deleted
# by that job, both reported gone, both still reachable through git ls-remote and
# GET /git/refs/heads while GET /branches omitted them.
#
# What is established: the ref is deleted for real and then comes back at its old
# sha. What is NOT established is by what. This comment used to name the forge's
# own internal write as the culprit; nixfleet #202 showed that reading rested on a
# `update by push` reflog entry, which is a PUSHING client's message for its own
# remote-tracking ref - receive-pack writes plain `push` - so it does not support
# the claim. Cause is nixfleet #194's, and not measurable from this repo.
#
# The job below does not need the answer. That is deliberate.
#
# The replacement does not check harder. It converges: delete through git, ask
# git again, delete again, bounded, with red reserved for a ref that outlasts
# every attempt. That lives in sweep-merged-branches.mjs, which already had the
# git-only enumeration and a test; running it on the merge as well as on the
# schedule is one implementation instead of two, and it is the one that is
# pinned. A merge that leaves the branch behind is now fixed by the next
# scheduled run rather than needing anybody to look.
name: Delete merged branch

on:
  pull_request:
    types: [closed]
  schedule:
    # 05:07 daily, off the hour and clear of the merge audit at 06:11 - the
    # runner takes one job at a time for seven repos.
    - cron: '7 5 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: docker
    # Four attempts five seconds apart is about twenty seconds of deleting in the
    # worst case, on top of the clone. Ten minutes is far more than that on
    # purpose: the cap is there to stop a hung job holding the single runner, not
    # to bound the retry, which bounds itself.
    timeout-minutes: 10
    steps:
      # Full history: merged-ness is the whole question, and a shallow clone
      # answers it wrong rather than not at all. The script refuses on one anyway.
      #
      # A checkout is also what makes the delete possible at all - git push needs
      # a repository to run from, which is why the old job could reach for the API
      # without one. credential-helper is what authenticates that push: this repo
      # is private, so without one the sweep's ls-remote and push --delete are
      # both anonymous, which is what kept this call site on actions/checkout
      # when the rest of the repo moved (bjorn/nixfleet#1000). The token goes in
      # a 0600 file in the runner's scratch with only its path in .git/config,
      # instead of persist-credentials' extraheader inside the workspace, which
      # every later step in the job can read. bjorn/ci-actions#18.
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/checkout@v1
        with:
          token: ${{ github.token }}
          depth: 0
          credential-helper: true
      - run: ./sweep-merged-branches.test.mjs
      - run: ./sweep-merged-branches.mjs

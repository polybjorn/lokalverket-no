# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when the PR actually merged.
# A closed-unmerged PR, anyone else's branch and main are all left alone.
#
# Ported from bjorn/media-tools (its issue #8, PR #9). media-tools runs on the
# python label and uses python3 + urllib because that image guarantees them;
# this repo's CI is runs-on: docker (node:22-bookworm), so the same request
# goes through node's global fetch - the one dependency this image cannot be
# missing is node.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    # The whole guard is here rather than in the script: a job that does not
    # run is clearer in the run list than a job that runs and decides to do
    # nothing.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'herd/')
    runs-on: docker
    timeout-minutes: 5
    steps:
      # No checkout: this only talks to the API, and the repo contents are not
      # needed to delete a ref.
      - name: Delete the head branch
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node -e '
          const branch = process.env.BRANCH;
          const headers = { Authorization: `token ${process.env.TOKEN}` };
          // Everything a branch name may contain is escaped except the slash,
          // which stays a path separator - herd/topic is two segments to the
          // API, and %2F is a different request. This is what urllib.parse.quote
          // does by default, so this port and the media-tools one agree.
          const path = encodeURIComponent(branch).replace(/%2F/g, "/");
          const url = `${process.env.API}/branches/${path}`;
          const fail = (m) => { console.error(m); process.exit(1); };

          fetch(url, { method: "DELETE", headers }).then(async (r) => {
            if (r.ok) return console.log(`deleted ${branch} (${r.status})`);
            const body = (await r.text()).trim();
            // Do not read the reason off the status. Forgejo 16.0.4 answers a
            // DELETE for a branch that is not there with 500 and an empty
            // message, not the 404 the API documents - measured against this
            // forge on 2026-09-14 - so a branch someone already removed with
            // the checkbox in the merge dialog would fail this job on every
            // single merge. Ask the end state instead: if the branch is gone,
            // the job has nothing to complain about. GET does return a clean
            // 404, which is why it is the one being trusted here.
            const check = await fetch(url, { headers });
            if (check.status === 404) {
              return console.log(`${branch} is already gone (DELETE said ${r.status})`);
            }
            // Anything else - a token that may not delete refs (403), a
            // protected branch (403), an API that moved, a forge that is down
            // so neither call answers - has to be loud. A cleanup job that
            // fails quietly just goes back to piling branches up without
            // saying so.
            fail(`could not delete ${branch}: ${r.status} ${r.statusText} ${body}`);
          }).catch(fail);
          '

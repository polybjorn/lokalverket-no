# Build gate on the self-hosted runner (media-runner, docker label ->
# node:22-bookworm). No test suite here yet - this proves the site builds on
# the forge the push lands on. GitHub Pages deploy stays in
# .github/workflows/deploy.yml, running off the push mirror.
#
# check-attribution.sh gates AI attribution (an AI co-author trailer, or a
# generated-with-style attribution line) in commit messages and PR
# descriptions. CLAUDE.md says not to add these; an agent has followed a
# conflicting session-level instruction and added them anyway more than once
# regardless. Also enforced by memory alone until this, and memory alone did
# not hold.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build

  attribution:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            ./check-attribution.sh commits "origin/${{ github.event.pull_request.base.ref }}..HEAD"
          else
            ./check-attribution.sh commits -1
          fi
      - name: Check PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          ./check-attribution.sh body /tmp/pr-body.txt

# Build gate on the self-hosted runner (media-runner, docker label ->
# node:22-bookworm). No test suite here yet - this proves the site builds on
# the forge the push lands on. GitHub Pages deploy stays in
# .github/workflows/deploy.yml, running off the push mirror.
#
# check-attribution.sh gates AI attribution in commit messages and PR
# descriptions: co-author trailers, generated-with lines, the per-session
# trailer a harness injects, and bare assistant URLs. CLAUDE.md says not to add
# these; an agent has followed a conflicting session-level instruction and
# added them anyway more than once regardless. Also enforced by memory alone
# until this, and memory alone did not hold. The pattern covered only the first
# two shapes until 2026-09-11, and a session trailer walked straight through
# it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # A green run here takes well under a minute - 11 seconds, measured. With no
    # timeout a wedged job reads as still working rather than broken, and the
    # runner takes one job at a time, so it keeps every other repo's CI queued
    # behind it.
    #
    # NOT for six hours, which is what this comment said until it was checked.
    # That figure is GitHub's hosted-runner default and does not apply here:
    # nixfleet modules/forgejo-runner.nix sets runner.timeout = "30m" with
    # capacity = 1, so the ceiling is thirty minutes and the queue is real. Ten
    # minutes is well above anything this job has taken and still fails the same
    # evening.
    timeout-minutes: 10
    # npm's default retry chain is slow to give up on a registry that does not
    # answer. These numbers were inherited from polybjorn-en; measured on the
    # hypervisor 2026-09-14 rather than taken on faith, and they hold:
    #
    #   failure shape          default    with the settings below
    #   connection refused     70s        10s
    #   DNS NXDOMAIN           70s        -
    #   packets dropped        >200s      >100s
    #
    # The last row is the one no comment mentioned and it matters: against a
    # black-holed registry these settings do NOT help. fetch-timeout governs the
    # HTTP response, not the TCP connect, so the kernel's connect timeout
    # dominates and npm sits there well past both figures. What bounds that case
    # is timeout-minutes on the job, not this block.
    #
    # nixfleet #136 also measured 7m25s in the shape media-runner actually fails
    # in, twice. That one is cited rather than reproduced - it is a property of
    # that host on that day, and nothing here can recreate it.
    env:
      npm_config_fetch_retries: 1
      npm_config_fetch_timeout: 15000
      # Has to stay above npm's mintimeout of 10s or npm refuses the config
      # outright - "minTimeout is greater than maxTimeout" - and the step then
      # fails for a reason that has nothing to do with the network.
      npm_config_fetch_retry_maxtimeout: 20000
    steps:
      - uses: actions/checkout@v4
      # The container image comes from the runner's docker label, configured in
      # nixfleet, so nothing in this repo makes it agree with .nvmrc - and for a
      # while it did not: the gate built on 22 while the Pages deploy built the
      # live site on 24. This does not fix the version, it refuses to be quiet
      # about it. Held back until now on purpose (#9): the runner was on 22, and
      # a check that fails every push over a gap nobody can close from this repo
      # is worse than the gap. nixfleet moved the image to node:24-bookworm, so
      # it can land.
      - name: Node matches .nvmrc
        run: |
          set -eu
          want=$(tr -d 'v \r\n' < .nvmrc | cut -d. -f1)
          have=$(node -p 'process.versions.node.split(".")[0]')
          # Printed either way: a passing run is the only place the runner's
          # actual version is written down, and knowing it is 24 is worth the
          # line the next time this disagrees.
          echo "runner node $have, .nvmrc asks for $want"
          [ "$want" = "$have" ] || {
            echo "move the runner image in nixfleet, or .nvmrc here - not one alone"
            exit 1
          }
      # A build that cannot reach the registry and a build with a real error are
      # the same red tick from the outside, minutes apart. This asks the one
      # question that tells them apart, and answers it in about a second when
      # the answer is yes.
      - name: Registry answers
        run: npm ping
        timeout-minutes: 1
      # The only other step that talks to the network, so the only other one
      # that stalls rather than failing.
      - run: npm ci
        timeout-minutes: 5
      - run: npm run build

  # The gate builds the site but never reads .github/workflows, so a change that
  # breaks only the Pages deploy used to land green - #10 did exactly that and
  # the deploy for the merge failed with both jobs here passing.
  lint:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned by version AND by checksum: this downloads a binary over the
      # network and then runs it, so "whatever is behind that URL today" is not
      # good enough. Moving the version means updating both lines.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -eu
          url="https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 2 --max-time 60 -o actionlint.tar.gz "$url"
          echo "$SHA256  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      # Both trees, not just one: .github/workflows is what publishes the site and
      # .forgejo/workflows is this gate. The self-hosted labels are declared in
      # .github/actionlint.yaml or every runs-on here reads as an unknown label.
      - name: Lint the workflow files
        run: ./actionlint -no-color .github/workflows/*.yml .forgejo/workflows/*.yml
      # actionlint checks `with:` keys only for actions in its popular-actions
      # database, which withastro/action is not in - it returns 0 on the file that
      # broke the deploy. This covers that one gap; the script says why in full.
      - name: Check withastro/action inputs
        run: ./check-workflow-inputs.sh
      # The checks this gate runs are themselves unreviewed code, and two of
      # check-merged-prs.mjs's paths fail OPEN - acknowledge-everything and
      # orphan-detection-off both turn the job green, so a broken watchdog looks
      # exactly like a healthy one. This pins all fourteen behaviours against git
      # fixtures and a stub API, offline, so a later edit cannot flatten one
      # quietly. Mutation-checked when written: removing the shallow guard,
      # acknowledging everything, disabling orphan detection, and letting the page
      # cap truncate each fail the test that should catch them.
      - name: The checks still behave
        run: ./check-merged-prs.test.mjs
      # The sweep is the one script here whose mistakes are destructive rather
      # than noisy, and until now its test ran only inside the delete workflow -
      # i.e. after a merge, on the thing that had already been merged. Running it
      # on the PR as well means a regression in it is caught before it can delete
      # anything. Mutation-checked when the retry was added: forcing one attempt,
      # dropping the sha comparison that spares a re-pushed branch, and reporting
      # green on exhaustion each fail the test that should catch them.
      - name: The sweep still behaves
        run: ./sweep-merged-branches.test.mjs

  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            ./check-attribution.sh commits "origin/${{ github.event.pull_request.base.ref }}..HEAD"
            exit 0
          fi
          # On a push, read what the push actually added. This used to be
          # `commits -1`, which on main is the merge commit and nothing else -
          # and a merge commit carries none of the trailers its parents do, so
          # anything that got past the pull_request job was invisible from then
          # on.
          zero=0000000000000000000000000000000000000000
          after=${AFTER:-HEAD}
          [ "$after" = "$zero" ] && after=HEAD
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$after"
          else
            # First push of a branch, or a runner that does not hand us the
            # previous tip. For a merge this is the branch it merged in; for a
            # plain commit it is that commit, which is what the old form did.
            range="$after^1..$after"
          fi
          echo "Checking $range"
          ./check-attribution.sh commits "$range"
      - name: Check PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          ./check-attribution.sh body /tmp/pr-body.txt

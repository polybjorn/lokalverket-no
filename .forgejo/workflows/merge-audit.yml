# Checks that every pull request the forge says it merged is actually on main.
#
# Twice on 2026-09-14 it was not. A merge landed, main moved back, and the merge
# commit was left unreachable - correct parents, correct content, on no branch.
# Every signal reported success: the PR said merged=true with a correct
# merge_commit_sha, the linked issue auto-closed, the head branch was deleted by
# the cleanup job (which guards on merged == true and cannot know), and the push
# CI run for the orphaned commit itself went green. Both were caught by a person
# reading `git log` and knowing which merge commit to expect.
#
# This job is that habit, made not-a-habit. It does not prevent the loss and
# does not explain it - the investigation is nixfleet #172 - it just refuses to
# let the loss be silent.
#
# Daily rather than per-merge on purpose: the failure is a ref being rolled back
# some time after the merge reports success, so a check that runs as part of the
# merge would be asking too early. It is also why the schedule matters more than
# the dispatch.
name: Merge audit

on:
  schedule:
    # 06:11 daily. Off the hour, and before anyone is likely to start merging.
    - cron: '11 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: docker
    timeout-minutes: 10
    steps:
      # Full history: reachability is the whole question, and a shallow clone
      # answers it wrong rather than not at all.
      #
      # Still actions/checkout rather than bjorn/ci-actions/checkout@v1, unlike
      # the rest of the repo: check-merged-prs.mjs refreshes origin/main itself
      # and exits 2 when it cannot, and that fetch is authenticated by
      # persist-credentials, which the other action deliberately does not do.
      # bjorn/nixfleet#1000.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # There is deliberately no separate credential-check step here. There was
      # one, and it printed ${#FORGE_PR_TOKEN} - which proves a variable is set
      # and nothing about whether the token works. polybjorn-en shipped that same
      # check, saw it pass, and then lost two minutes of work to a 403 from the
      # endpoint it claimed to have checked.
      #
      # The script below already makes the real request as its first act and
      # reports the status it got, exiting 2 for "cannot answer" rather than 1 for
      # "found something". A second check that proves less than the first is worse
      # than none: it is the one a reader trusts.

      - name: Every merged PR is on main
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -eu
          # No `git fetch` here on purpose. The script refreshes the ref itself,
          # and having it in both places means two things that must agree and
          # eventually will not. Worse, when the fetch lived only here, CI was the
          # one execution path that was correct and every hand-run was judged
          # against a stale clone - so the fault would have survived any amount of
          # "I ran it locally and it was fine".
          ./check-merged-prs.mjs --days 7 --ref origin/main

# Checks that every pull request the forge says it merged is actually on main.
#
# Twice on 2026-09-14 it was not. A merge landed, main moved back, and the merge
# commit was left unreachable - correct parents, correct content, on no branch.
# Every signal reported success: the PR said merged=true with a correct
# merge_commit_sha, the linked issue auto-closed, the head branch was deleted by
# the cleanup job (which guards on merged == true and cannot know), and the push
# CI run for the orphaned commit itself went green. Both were caught by a person
# reading `git log` and knowing which merge commit to expect.
#
# This job is that habit, made not-a-habit. It does not prevent the loss and
# does not explain it - the investigation is nixfleet #172 - it just refuses to
# let the loss be silent.
#
# Daily rather than per-merge on purpose: the failure is a ref being rolled back
# some time after the merge reports success, so a check that runs as part of the
# merge would be asking too early. It is also why the schedule matters more than
# the dispatch.
name: Merge audit

on:
  schedule:
    # 06:11 daily. Off the hour, and before anyone is likely to start merging.
    - cron: '11 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: docker
    timeout-minutes: 10
    steps:
      # Full history: reachability is the whole question, and a shallow clone
      # answers it wrong rather than not at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the work, not after. A job that cannot reach the API should say so
      # in its first seconds rather than looking like a clean audit - which is
      # exactly the failure mode this job exists to remove.
      - name: FORGE_PR_TOKEN resolves
        env:
          PR_TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -eu
          if [ -z "${PR_TOKEN:-}" ]; then
            echo "FORGE_PR_TOKEN is empty or not visible to this repo."
            echo "Reading pulls needs it; the automatic Actions token is answered"
            echo "404 'Can not read pulls' on this forge."
            exit 1
          fi
          echo "FORGE_PR_TOKEN resolved, ${#PR_TOKEN} characters"

      - name: Every merged PR is on main
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -eu
          # checkout leaves a detached HEAD; the script compares against a
          # remote-tracking ref, so make sure it is current rather than whatever
          # the clone happened to bring.
          git fetch --quiet origin main
          ./check-merged-prs.mjs --days 7 --ref origin/main

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # The action defaults to Node 20 and Astro 7 requires >=22.12.0, so
          # this has to be set. It reads .nvmrc rather than repeating the number,
          # so the version the live site is built with is stated in one place and
          # can be checked against the forge runner once that runner is on the
          # same version. polybjorn-en pins it the same way.
          node-version-file: .nvmrc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
